[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prudential-evidence-lab"
version = "0.1.0"
description = "Auditable document assistant with evidence contracts and claim-level citations"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
notebooks = [
  "ipykernel>=6.29,<7",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "pandas>=2.2,<3",
]
ingestion = [
  "docling>=2.60,<3",
  "pymupdf>=1.26,<2",
]
online-models = [
  "google-genai>=1.30,<2",
  "python-dotenv>=1.1,<2",
  "truststore>=0.10,<1",
]
local-models = [
  "sentence-transformers>=5,<6",
  "numpy>=2,<3",
]

[project.scripts]
pel-ingest = "ingestion.cli:main"
pel-build-corpus = "ingestion.promote:main"
pel-render-document = "ingestion.render:main"
pel-enrich-visuals = "ingestion.enrich_visuals:main"
pel-refresh-qrt-evidence = "ingestion.refresh_qrt_evidence:main"
pel-update-metadata = "ingestion.update_metadata:main"
pel-promote-many = "ingestion.promote_many:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*", "evals*", "ingestion*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
app = [
  "data/*.json",
  "data/indexes/*/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
